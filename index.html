<!doctype html>
<html lang="en"> 
 <head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
  <meta name="color-scheme" content="dark"> 
  <title>Snake Game</title> 
  <style>
* {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    padding: 10px;
}

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

#score {
    margin: 8px 0;
    font-size: 20px;
    font-weight: bold;
    color: #ffeb3b;
    text-shadow: 1px 1px 5px black;
    flex-shrink: 0;
}

#canvasWrapper {
    position: relative;
    flex-shrink: 0;
    margin: 10px 0;
}

canvas {
    background: radial-gradient(circle at top left, #1f4037, #99f2c8);
    border: 4px solid #ffeb3b;
    border-radius: 12px;
    touch-action: none;
    display: block;
    margin: 0 auto;
}

#pauseOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: bold;
    color: #ffeb3b;
    text-shadow: 2px 2px 10px black;
    pointer-events: none;
    border-radius: 8px;
}

.controls, .movement-controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
    flex-shrink: 0;
}

.movement-controls {
    display: grid;
    grid-template-columns: 80px 80px 80px; /* increased */
    grid-template-rows: 80px 80px;        /* increased */
    gap: 14px;                            /* more space */
    margin-top: 15px;
}

.empty { visibility: hidden; }

.btn {
    padding: 18px 36px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(145deg, #ff6a00, #ee0979);
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.movement-controls .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;              /* important */
    font-size: 22px;         /* keeps arrows bold & clear */
}

.btn:active {
    transform: scale(0.95);
}

#gameOverModal,
#quitEndModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal-content {
    background: linear-gradient(135deg, #ff6a00, #ee0979);
    padding: 30px 40px;
    border-radius: 20px;
    text-align: center;
    color: white;
    max-width: 90%;
    width: 400px;
}

.modal-content h2 {
    margin-bottom: 20px;
    font-size: 28px;
}

.modal-content p {
    margin-bottom: 25px;
    font-size: 18px;
}

.modal-content .btn {
    margin: 8px;
}

/* Desktop optimizations */
@media (min-width: 768px) {
    body {
        padding: 20px;
    }
    
    #score {
        font-size: 24px;
        margin: 12px 0;
    }
    
    .movement-controls {
        display: none;
    }
    
    .controls {
        margin-top: 20px;
    }
    
    #pauseOverlay {
        font-size: 64px;
    }
}

/* Mobile small screen adjustments */
@media (max-width: 480px) {
    body {
        padding: 5px;
    }
    
    #score {
        font-size: 18px;
        margin: 5px 0;
    }
    
    #canvasWrapper {
        margin: 5px 0;
    }
    
    .movement-controls {
        grid-template-columns: 70px 70px 70px;
        grid-template-rows: 70px 70px;
        gap: 12px;
        margin-top: 10px;
    }
    
    .controls {
        gap: 10px;
        margin-top: 10px;
    }
    
    .btn {
        padding: 16px 32px;
        font-size: 18px;
    }
    
    #pauseOverlay {
        font-size: 36px;
    }
    
    .modal-content {
        padding: 20px 25px;
        width: 90%;
    }
    
    .modal-content h2 {
        font-size: 24px;
        margin-bottom: 15px;
    }
    
    .modal-content p {
        font-size: 16px;
        margin-bottom: 20px;
    }
}

/* Very small screens */
@media (max-height: 600px) {
    #score {
        font-size: 16px;
        margin: 3px 0;
    }
    
    #canvasWrapper {
        margin: 3px 0;
    }
    
    .movement-controls {
        grid-template-columns: 45px 45px 45px;
        grid-template-rows: 45px 45px;
        gap: 6px;
        margin-top: 5px;
    }
    
    .controls {
        margin-top: 5px;
        gap: 8px;
    }
    
    .btn {
        padding: 14px 28px;
        font-size: 17px;
    }
}
</style> 
 </head> 
 <body> 
  <div id="score">
    Score: 0 
  </div> 
  <div id="canvasWrapper"> 
   <canvas id="game"></canvas> 
   <div id="pauseOverlay">
     PAUSED 
   </div> 
  </div> 
  <div class="movement-controls"> 
   <div class="empty"></div> <button class="btn" data-dir="UP">↑</button> 
   <div class="empty"></div> <button class="btn" data-dir="LEFT">←</button> <button class="btn" data-dir="DOWN">↓</button> <button class="btn" data-dir="RIGHT">→</button> 
  </div> 
  <div class="controls"> <button class="btn" id="pauseResumeBtn">Pause</button> <button class="btn" id="restartBtn">Restart</button> 
  </div> 
  <div id="gameOverModal"> 
   <div class="modal-content"> 
    <h2>Game Over!</h2> 
    <p id="finalScore">Score: 0</p> <button class="btn" id="restartModalBtn">Restart</button> <button class="btn" id="quitModalBtn">Quit</button> 
   </div> 
  </div> 
  <div id="quitEndModal"> 
   <div class="modal-content"> 
    <h2>Thanks for Playing</h2> 
    <p>Want to try again?</p> <button class="btn" id="tryAgainBtn">Try Again</button> 
   </div> 
  </div> 
  <script>
"use strict";

document.addEventListener("DOMContentLoaded", () => {

/* ======================== CONFIGURATION ======================== */
const CONFIG = Object.freeze({
    TILE_SIZE: 20,
    UI_HEIGHT: 300,
    INITIAL_SPEED: 5,
    MAX_SPEED: 15,
    SPEED_INCREMENT_SCORE: 5,
    TARGET_FPS: 60,
    MIN_COLS: 10,
    MIN_ROWS: 10,
    MAX_UPDATES_PER_FRAME: 5
});

/* ======================== CANVAS SETUP (HiDPI Support) ======================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

let cols, rows;
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
    // Update DPR in case it changed (e.g., moved to different monitor)
    dpr = window.devicePixelRatio || 1;
    
    const displayWidth = Math.floor(window.innerWidth / CONFIG.TILE_SIZE) * CONFIG.TILE_SIZE;
    const displayHeight = Math.floor((window.innerHeight - CONFIG.UI_HEIGHT) / CONFIG.TILE_SIZE) * CONFIG.TILE_SIZE;
    
    // Set CSS size
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';
    
    // Set actual canvas size (scaled for HiDPI)
    canvas.width = displayWidth * dpr;
    canvas.height = displayHeight * dpr;
    
    // Scale context for HiDPI
    ctx.scale(dpr, dpr);
    
    cols = Math.max(CONFIG.MIN_COLS, displayWidth / CONFIG.TILE_SIZE);
    rows = Math.max(CONFIG.MIN_ROWS, displayHeight / CONFIG.TILE_SIZE);
}

resizeCanvas();

let resizeTimeout;
window.addEventListener("resize", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        const oldCols = cols;
        const oldRows = rows;
        
        resizeCanvas();
        
        // Validate snake positions after resize
        if (oldCols !== cols || oldRows !== rows) {
            snake = snake.filter(s => 
                s.x > 0 && s.x < cols - 1 && 
                s.y > 0 && s.y < rows - 1
            );
            
            if (snake.length === 0 && gameRunning) {
                endGame();
            } else if (gameRunning) {
                food = randomFood();
            }
        }
    }, 250);
});

/* ======================== GAME STATE ======================== */
let snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
let direction = "RIGHT";
let nextDirection = "RIGHT";
let food = randomFood();
let score = 0;
let gameRunning = true;
let paused = false;

/* ======================== SPEED ======================== */
let speed = CONFIG.INITIAL_SPEED;
let lastSpeedIncrease = 0;

/* ======================== TIMING ======================== */
let lastTime = 0;
let accumulator = 0;
let lastFrameTime = 0;
const FRAME_TIME = 1000 / CONFIG.TARGET_FPS;

/* ======================== INPUT SYSTEM ======================== */
let lastInputTime = 0;
const INPUT_DEBOUNCE = 50;

// Touch/Swipe variables
let touchStartX = 0;
let touchStartY = 0;
const SWIPE_THRESHOLD = 50;

function setDir(dir) {
    const now = performance.now();
    if (now - lastInputTime < INPUT_DEBOUNCE) return;
    
    if ((dir === "LEFT" && direction !== "RIGHT") ||
        (dir === "RIGHT" && direction !== "LEFT") ||
        (dir === "UP" && direction !== "DOWN") ||
        (dir === "DOWN" && direction !== "UP")) {
        nextDirection = dir;
        lastInputTime = now;
    }
}

// Movement button listeners
document.querySelectorAll('.movement-controls .btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const dir = btn.dataset.dir;
        if (dir) setDir(dir);
    });
});

// Keyboard controls with preventDefault
document.addEventListener("keydown", e => {
    const keyMap = {
        'ArrowUp': 'UP',
        'ArrowDown': 'DOWN',
        'ArrowLeft': 'LEFT',
        'ArrowRight': 'RIGHT'
    };
    
    if (keyMap[e.key]) {
        e.preventDefault();
        setDir(keyMap[e.key]);
    }
});

// Swipe controls for mobile
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    const deltaY = e.changedTouches[0].clientY - touchStartY;
    
    if (Math.abs(deltaX) < SWIPE_THRESHOLD && Math.abs(deltaY) < SWIPE_THRESHOLD) {
        return;
    }

    if (Math.abs(deltaX) > Math.abs(deltaY)) {
        setDir(deltaX > 0 ? 'RIGHT' : 'LEFT');
    } else {
        setDir(deltaY > 0 ? 'DOWN' : 'UP');
    }
}, { passive: false });

/* ======================== HELPERS ======================== */
function randomFood() {
    let newFood;
    let attempts = 0;
    const maxAttempts = cols * rows;
    
    do {
        newFood = {
            x: Math.floor(Math.random() * (cols - 2)) + 1,
            y: Math.floor(Math.random() * (rows - 2)) + 1
        };
        attempts++;
        if (attempts > maxAttempts) {
            return newFood;
        }
    } while (snake.some(s => s.x === newFood.x && s.y === newFood.y));
    
    return newFood;
}

/* ======================== UPDATE ======================== */
function update(dt) {
    if (paused || !gameRunning) return;
    
    accumulator += dt;
    const stepTime = 1 / speed;
    
    let updates = 0;
    while (accumulator >= stepTime && updates < CONFIG.MAX_UPDATES_PER_FRAME) {
        accumulator -= stepTime;
        moveSnake();
        updates++;
        
        if (!gameRunning) return;
    }
    
    // Prevent spiral of death
    if (accumulator > stepTime * CONFIG.MAX_UPDATES_PER_FRAME) {
        accumulator = 0;
    }
}

/* ======================== MOVE ======================== */
function moveSnake() {
    direction = nextDirection;
    let head = { x: snake[0].x, y: snake[0].y };
    
    if (direction === "LEFT") head.x--;
    if (direction === "RIGHT") head.x++;
    if (direction === "UP") head.y--;
    if (direction === "DOWN") head.y++;

    // Wall collision
    if (head.x <= 0 || head.y <= 0 || head.x >= cols - 1 || head.y >= rows - 1) {
        endGame(); 
        return;
    }

    // Self collision (skip head check - optimization)
    if (snake.slice(1).some(p => p.x === head.x && p.y === head.y)) {
        endGame(); 
        return;
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = "Score: " + score;
        
        // Speed increase logic (fixed)
        if (score - lastSpeedIncrease >= CONFIG.SPEED_INCREMENT_SCORE && speed < CONFIG.MAX_SPEED) {
            speed++;
            lastSpeedIncrease = score;
        }
        
        food = randomFood();
    } else {
        snake.pop();
    }
}

/* ======================== DRAW ======================== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Border
    ctx.fillStyle = "#f44336";
    for (let i = 0; i < cols; i++) {
        ctx.fillRect(i * CONFIG.TILE_SIZE, 0, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
        ctx.fillRect(i * CONFIG.TILE_SIZE, (rows - 1) * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
    }
    for (let i = 0; i < rows; i++) {
        ctx.fillRect(0, i * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
        ctx.fillRect((cols - 1) * CONFIG.TILE_SIZE, i * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
    }

    // Food
    ctx.fillStyle = "#ffeb3b";
    ctx.fillRect(food.x * CONFIG.TILE_SIZE, food.y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);

    // Snake
    for (let i = 0; i < snake.length; i++) {
        let segment = snake[i];
        ctx.beginPath();
        
        if (i === 0) {
            // Head
            ctx.fillStyle = "#00ff00";
            ctx.arc(
                segment.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2, 
                segment.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2, 
                CONFIG.TILE_SIZE / 2, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(
                segment.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE * 0.3, 
                segment.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE * 0.3, 
                2, 
                0, 
                Math.PI * 2
            );
            ctx.arc(
                segment.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE * 0.7, 
                segment.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE * 0.3, 
                2, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
        } else if (i === snake.length - 1) {
            // Tail
            ctx.fillStyle = "#006400";
            ctx.arc(
                segment.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2, 
                segment.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2, 
                CONFIG.TILE_SIZE * 0.35, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
        } else {
            // Body
            ctx.fillStyle = `hsl(${(i * 10) % 360}, 80%, 50%)`;
            ctx.arc(
                segment.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2, 
                segment.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2, 
                CONFIG.TILE_SIZE * 0.45, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
        }
    }
}

/* ======================== GAME LOOP ======================== */
function loop(time) {
    // FPS cap
    if (time - lastFrameTime < FRAME_TIME) {
        if (gameRunning) {
            requestAnimationFrame(loop);
        }
        return;
    }
    lastFrameTime = time;
    
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt > 0.1) dt = 0.1;
    
    update(dt);
    draw();
    
    if (gameRunning) {
        requestAnimationFrame(loop);
    }
}

/* ======================== GAME OVER ======================== */
const modal = document.getElementById("gameOverModal");
const quitModal = document.getElementById("quitEndModal");
const finalScore = document.getElementById("finalScore");
const pauseOverlay = document.getElementById("pauseOverlay");

function endGame() {
    if (!gameRunning) return;
    gameRunning = false;
    paused = true;
    finalScore.textContent = "Score: " + score;
    modal.style.display = "flex";
}

/* ======================== CONTROLS ======================== */
const pauseResumeBtn = document.getElementById("pauseResumeBtn");

function togglePause() {
    paused = !paused;
    pauseResumeBtn.textContent = paused ? "Resume" : "Pause";
    pauseOverlay.style.display = paused ? "flex" : "none";
}

function resetGame() {
    resizeCanvas();
    snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
    direction = "RIGHT";
    nextDirection = "RIGHT";
    food = randomFood();
    score = 0;
    speed = CONFIG.INITIAL_SPEED;
    lastSpeedIncrease = 0;
    accumulator = 0;
    gameRunning = true;
    paused = false;
    
    document.getElementById("score").textContent = "Score: " + score;
    pauseResumeBtn.textContent = "Pause";
    pauseOverlay.style.display = "none";
    modal.style.display = "none";
    quitModal.style.display = "none";
    
    lastTime = performance.now();
    lastFrameTime = performance.now();
    requestAnimationFrame(loop);
}

pauseResumeBtn.addEventListener("click", togglePause);
document.getElementById("restartBtn").addEventListener("click", resetGame);
document.getElementById("restartModalBtn").addEventListener("click", resetGame);

document.getElementById("quitModalBtn").addEventListener("click", () => {
    modal.style.display = "none";
    quitModal.style.display = "flex";
});

document.getElementById("tryAgainBtn").addEventListener("click", resetGame);

// Start game
lastTime = performance.now();
lastFrameTime = performance.now();
requestAnimationFrame(loop);

});
</script> 
 
</body></html>
